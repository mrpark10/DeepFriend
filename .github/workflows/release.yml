name: Release

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  vscode:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build package
        working-directory: extension
        run: |
          npm ci
          npx vsce package --no-dependencies -o deepfriend.vsix
      - name: Publish to VS Code Marketplace
        working-directory: extension
        run: npx vsce publish --packagePath deepfriend.vsix -p "${{ secrets.VSCE_PAT }}"
      - name: Publish to Open VSX
        working-directory: extension
        run: npx ovsx publish deepfriend.vsix -p "${{ secrets.OVSX_PAT }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: extension/deepfriend.vsix

  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        working-directory: python
        run: |
          python -m pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
