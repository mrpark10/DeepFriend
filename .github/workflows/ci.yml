name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

jobs:
  python:
    name: python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Install PyTorch (CPU) and TensorFlow
        if: matrix.python == '3.12'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then python -m pip install torch; else python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install tensorflow
      - name: Lint
        working-directory: python
        run: ruff check .
      - name: Test
        working-directory: python
        env:
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: python -m pytest -q

  extension:
    name: extension · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch (CPU) and TensorFlow for the analyzer tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then python -m pip install torch; else python -m pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          python -m pip install tensorflow
          echo "DEEPFRIEND_TEST_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Install
        working-directory: extension
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: extension
        run: |
          npm run typecheck
          npm run test:unit
      - name: Integration tests (Linux)
        if: runner.os == 'Linux'
        working-directory: extension
        run: xvfb-run -a npm run test:int
      - name: Integration tests (macOS / Windows)
        if: runner.os != 'Linux'
        working-directory: extension
        run: npm run test:int
      - name: Package
        if: runner.os == 'Linux'
        working-directory: extension
        run: npx vsce package --no-dependencies -o deepfriend.vsix
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: vsix
          path: extension/deepfriend.vsix
