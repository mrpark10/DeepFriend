[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepfriend"
version = "0.1.0"
description = "DeepFriend: training doctor, experiment log and shape checker for PyTorch/TensorFlow learners (companion of the DeepFriend VS Code extension)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Junho Park", email = "sk92977852@gmail.com" }]
keywords = ["pytorch", "tensorflow", "keras", "deep learning", "education", "vscode"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mrpark10/DeepFriend"
Issues = "https://github.com/mrpark10/DeepFriend/issues"

[tool.setuptools.packages.find]
include = ["deepfriend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
